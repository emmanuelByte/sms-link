<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>SMS / RCS Link Test</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f5; color: #111; }
    main { width: min(560px, calc(100% - 40px)); background: #fff; padding: 32px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 1.6rem; }
    p { line-height: 1.55; }
    .button { display: block; box-sizing: border-box; width: 100%; margin-top: 24px; padding: 16px 20px; border: 0; border-radius: 12px; background: #111; color: #fff; text-align: center; text-decoration: none; font-size: 1rem; font-weight: 700; }
    code { display: block; margin-top: 24px; padding: 14px; background: #eee; border-radius: 10px; overflow-wrap: anywhere; font-size: .8rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
      main { background: #1b1b1b; }
      code { background: #292929; }
      .button { background: #fff; color: #111; }
    }
  </style>
</head>
<body>
  <main>
    <h1>SMS / RCS Link Test</h1>
    <p>Tap the button below to open your device's messaging app with the original EDEKA target and message.</p>

    <a class="button" href="sms:edeka_qgnijasc_agent%40rbm.goog?body=Ich%20m%C3%B6chte%20%C3%BCber%20die%20neuesten%20EDEKA%20Angebote%20informiert%20werden">
      Open Messenger
    </a>

    <code>sms:edeka_qgnijasc_agent%40rbm.goog?body=Ich%20m%C3%B6chte%20%C3%BCber%20die%20neuesten%20EDEKA%20Angebote%20informiert%20werden</code>
  </main>
</body>
</html>
